name: Build & publish APK

# Builds a release APK and attaches it to a GitHub Release.
#  * push a tag  -> a release for that tag
#  * manual run  -> a build you can download from the workflow artifacts
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the artifact after the version
        id: rename
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          cp build/app/outputs/flutter-apk/app-release.apk \
             "wifi-signal-tester-$VERSION.apk"
          echo "apk=wifi-signal-tester-$VERSION.apk" >> "$GITHUB_OUTPUT"
          # On a tag push use that tag; on a manual run fall back to VERSION.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.rename.outputs.apk }}

      # Publishes on a tag push and on a manual run alike: the tag is taken from
      # the ref, or created from VERSION when there isn't one yet.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename.outputs.tag }}
          name: ${{ steps.rename.outputs.tag }}
          files: |
            ${{ steps.rename.outputs.apk }}
            build/app/outputs/flutter-apk/app-release.apk
          body_path: docs/release-notes.md
          fail_on_unmatched_files: false
