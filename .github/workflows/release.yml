name: Build APK

# Every push to main produces a downloadable APK artifact. Tags are optional:
# a v* tag additionally publishes the same APK as a GitHub Release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk: ${{ steps.rename.outputs.apk }}
      artifact: ${{ steps.rename.outputs.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK after the app version
        id: rename
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          APK="wifi-signal-tester-$VERSION.apk"
          ARTIFACT="wifi-signal-tester-$VERSION-build-${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.artifact }}
          path: ${{ steps.rename.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ needs.build.outputs.apk }}
          body_path: docs/release-notes.md
          fail_on_unmatched_files: true
