name: Build Android and macOS

# Every push/merge to main builds an APK and a zipped macOS .app, then publishes
# one GitHub Release for the version in /VERSION. The workflow creates the v*
# tag itself; manual tags are neither needed nor used as a trigger. Pull
# requests build both platforms but do not publish a release.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk: ${{ steps.rename.outputs.apk }}
      artifact: ${{ steps.rename.outputs.artifact }}
      version: ${{ steps.rename.outputs.version }}
      tag: ${{ steps.rename.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify version files are in sync
        shell: bash
        run: |
          VERSION_NUMBER=$(tr -d '[:space:]' < VERSION)
          PUBSPEC_VERSION=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          APP_VERSION=$(sed -n "s/^const String kAppVersion = '\([^']*\)';/\1/p" lib/app_info.dart)

          if [ "$VERSION_NUMBER" != "$PUBSPEC_VERSION" ] || [ "$VERSION_NUMBER" != "$APP_VERSION" ]; then
            echo "::error::Version mismatch: VERSION=$VERSION_NUMBER, pubspec.yaml=$PUBSPEC_VERSION, lib/app_info.dart=$APP_VERSION"
            exit 1
          fi

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK after the app version
        id: rename
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          APK="wifi-signal-tester-$VERSION.apk"
          ARTIFACT="wifi-signal-tester-$VERSION-build-${GITHUB_RUN_NUMBER}"
          TAG="v$VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.artifact }}
          path: ${{ steps.rename.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS (Apple silicon)
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      zip: ${{ steps.package.outputs.zip }}
      artifact: ${{ steps.package.outputs.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify macOS toolchain
        run: |
          xcodebuild -version
          pod --version

      - name: Fetch packages
        run: flutter pub get

      - name: Build release macOS app
        run: flutter build macos --release

      - name: Package macOS app
        id: package
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          APP="build/macos/Build/Products/Release/Wi-Fi Signal Tester.app"
          ZIP="wifi-signal-tester-$VERSION-macos-arm64.zip"
          ARTIFACT="wifi-signal-tester-$VERSION-macos-arm64-build-${GITHUB_RUN_NUMBER}"

          if [ ! -d "$APP" ]; then
            echo "::error::Built app not found at $APP"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish version from main
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs:
      - build
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-assets

      - name: Download built macOS app
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.macos.outputs.artifact }}
          path: release-assets

      - name: Verify version has not already been used for different code
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_TREE=$(git rev-parse "$TAG^{tree}")
            BUILD_TREE=$(git rev-parse "$GITHUB_SHA^{tree}")
            if [ "$TAG_TREE" != "$BUILD_TREE" ]; then
              echo "::error::Tag $TAG already belongs to different code. Bump VERSION before merging to main."
              exit 1
            fi
          fi

      - name: Create or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          APK: release-assets/${{ needs.build.outputs.apk }}
          MACOS_ZIP: release-assets/${{ needs.macos.outputs.zip }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$MACOS_ZIP" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$MACOS_ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file docs/release-notes.md \
              --latest
          fi
