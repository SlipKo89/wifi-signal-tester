name: wifi_apk
description: >-
  MikroTik-assisted Wi-Fi signal tester — see how the access point hears your
  device, not just how your device hears the access point. Read-only.
publish_to: 'none'

# Semantic version + build number. Keep in sync with /VERSION and CHANGELOG.md.
version: 0.3.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # MikroTik REST transport
  http: ^1.2.0

  # MikroTik SSH transport (RouterOS CLI over SSH, read-only commands)
  dartssh2: ^2.22.4

  # Opening the project page / usage guide in a browser
  url_launcher: ^6.3.1

  # Phone-side Wi-Fi facts (SSID / BSSID / IP / gateway) and RSSI
  network_info_plus: ^5.0.3
  wifi_iot: ^0.3.19

  # Secure credential storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.0.0

  # Runtime location permission — Android reveals SSID/BSSID only when granted
  permission_handler: ^11.3.1

  # Settings persistence (non-secret)
  shared_preferences: ^2.2.3

  # Persistent measurement history
  sqflite: ^2.3.3
  path: ^1.9.0

  # CSV export / share
  share_plus: ^9.0.0
  path_provider: ^2.1.3

  # Explicit, user-triggered support bundle (report + event log)
  archive: ^4.0.9

  # Audible alert on signal asymmetry
  audioplayers: ^6.1.0

  # Latency / ping to the gateway
  dart_ping: ^9.0.1

  # PDF audit report + share/print
  pdf: ^3.11.0
  printing: ^5.13.0

  # MD5 challenge-response for legacy RouterOS binary-API login
  crypto: ^3.0.3

  # Live signal sparkline
  fl_chart: ^0.66.2

  # Simple state management
  provider: ^6.1.2

  # @visibleForTesting on the SSH output parsers
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E1116"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
